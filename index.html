<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Crossing Hidroponik 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #e0f7fa;
            --accent-teal: #4db6ac;
            --accent-green: #81c784;
            --text-brown: #8d6e63;
            --card-white: rgba(255, 255, 255, 0.95);
            --border-radius: 30px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(180deg, #e0f9f3 0%, #f1f8e9 50%, #fff9c4 100%);
            background-attachment: fixed;
            color: #5d4037;
            padding: 40px 15px;
            overflow-x: hidden;
        }

        /* BACKGROUND DECORATIONS */
        .decor { position: absolute; z-index: -1; pointer-events: none; opacity: 0.8; }
        .decor-leaf { top: 100px; left: -20px; width: 100px; transform: rotate(-15deg); }
        .decor-coin { top: 120px; right: 20px; width: 50px; }
        .decor-apple { bottom: 300px; left: 50%; width: 40px; }

        .wrapper { max-width: 800px; margin: 0 auto; position: relative; }

        /* HEADER */
        .header { text-align: center; margin-bottom: 40px; position: relative; }
        .logo-img { width: 300px; margin-bottom: 10px; }
        .header-tag { 
            background: #4cb6ac; color: white; padding: 8px 30px; 
            border-radius: 50px; display: inline-block; font-weight: 800; font-size: 1.1em;
            box-shadow: 0 4px 0 #3b8e86;
        }

        /* GRID */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 25px; }

        /* CARD STYLE */
        .card {
            background: var(--card-white);
            border-radius: var(--border-radius);
            padding: 25px;
            border: 5px solid #ffffff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            position: relative;
        }
        .card-title {
            font-size: 0.9em; font-weight: 900; text-transform: uppercase; color: var(--accent-teal);
            margin-bottom: 15px; display: flex; align-items: center; gap: 8px;
        }

        /* SQUIRREL POSITIONS */
        .char-tupai { position: absolute; width: 80px; z-index: 2; }
        .tupai-1 { top: -60px; right: -20px; } /* Marshall */
        .tupai-2 { bottom: -40px; right: -30px; } /* Mint */
        .tupai-3 { bottom: -20px; left: -40px; } /* Poppy */

        input {
            width: 100%; padding: 12px 20px; border-radius: 15px; border: 2px solid #b2dfdb;
            margin-bottom: 10px; font-family: inherit; outline: none; background: #f5fdfb;
        }
        
        .btn {
            background: #4db6ac; color: white; border: none; padding: 12px;
            border-radius: 25px; font-weight: 800; cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 0 #3b8e86; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-dark { background: #cfd8dc; color: #546e7a; box-shadow: 0 4px 0 #b0bec5; }

        /* SENSOR & RELAY UI */
        .sensor-val { font-size: 4em; font-weight: 900; color: #5c6bc0; text-align: center; margin: 10px 0; }
        .sensor-unit { font-size: 0.4em; color: #9e9e9e; margin-left: 5px; }
        
        .relay-status-box {
            text-align: center; padding: 20px;
        }
        .relay-big-icon { font-size: 5em; color: #e0e0e0; transition: 0.3s; }
        .card.on .relay-big-icon { color: #ffd54f; }
        .relay-label { font-size: 2.5em; font-weight: 900; color: #bdbdbd; margin-top: 10px; }
        .card.on .relay-label { color: #4db6ac; }

        /* TERMINAL */
        .terminal { 
            background: #26a69a; border-radius: 30px; padding: 25px; 
            border: 6px solid #fff; position: relative; margin-top: 50px;
        }
        .log-panel { height: 120px; overflow-y: auto; color: #e0f2f1; font-family: 'Space Mono', monospace; font-size: 13px; }

        /* ALERT AREA */
        .alert-banner { 
            background: #fff59d; padding: 15px; border-radius: 25px; margin-bottom: 20px; 
            display: none; border: 4px solid #fff; align-items: center; gap: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .alert-banner.show { display: flex; animation: shake 0.5s; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
            .logo-img { width: 220px; }
        }
    </style>
</head>
<body>

<img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector.png?raw=true" class="decor decor-leaf">
<img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20257.png?raw=true" class="decor decor-coin">

<div class="wrapper">
    <div class="header">
        <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2012.png?raw=true" alt="Garden Crossing Logo" class="logo-img"><br>
        <div class="header-tag">Monitoring & Control Automatic</div>
        <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2018.png?raw=true" class="char-tupai tupai-1">
    </div>

    <div class="grid-2">
        <div class="card">
            <div class="card-title"><i class="fas fa-cloud"></i> Firebase Sync</div>
            <input type="password" id="fb-apiKey" placeholder="API Key">
            <input type="text" id="fb-dbUrl" placeholder="Database URL">
            <input type="text" id="fb-path" value="smarthome/ruangan1">
            <button class="btn" id="btn-connect-fb"><i class="fas fa-link"></i> Hubungkan</button>
        </div>

        <div class="card">
            <div class="card-title"><i class="fas fa-microchip"></i> Micro:bit BLE</div>
            <div style="margin-bottom: 15px; font-size: 0.8em; opacity: 0.7;">Status: <span id="status-bt">Offline</span></div>
            <button class="btn" id="btn-connect-ble"><i class="fab fa-bluetooth-b"></i> Connect</button>
            <button class="btn btn-dark" id="btn-disconnect-ble" disabled style="margin-top:8px;">Disconnect</button>
        </div>
    </div>

    <div style="text-align: center; margin-bottom: 30px;">
        <div style="background: white; display: inline-flex; padding: 8px 25px; border-radius: 50px; align-items: center; gap: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
            <b id="modePill" style="color: #4db6ac;">MODE: OTOMATIS</b>
            <button class="btn" style="width: auto; padding: 5px 15px; font-size: 0.8em;" id="btnToggleMode">Ganti</button>
        </div>
    </div>

    <div class="alert-banner" id="alertEmber">
        <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20274.png?raw=true" width="40">
        <div>
            <strong style="display:block; color: #f57c00;">Air Ember Habis!</strong>
            <small>Sensor mendeteksi air sangat rendah.</small>
        </div>
    </div>

    <div class="grid-2">
        <div class="card">
            <div class="card-title"><i class="fas fa-tint"></i> Ultrasonik 1 (P0)</div>
            <div class="sensor-val" id="val-jarak">--<span class="sensor-unit">cm</span></div>
            <div style="height:60px;"><canvas id="chart-jarak"></canvas></div>
            <p style="font-size: 0.7em; text-align: center; margin-top: 10px; opacity: 0.6;">Pompa ON jika ≥ 30 cm</p>
        </div>

        <div class="card">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2019.png?raw=true" class="char-tupai tupai-2">
            <div class="card-title"><i class="fas fa-water"></i> Ultrasonik 2 (Ember)</div>
            <div class="sensor-val" id="val-jarak-manual" style="color: #4db6ac;">--<span class="sensor-unit">cm</span></div>
            <div style="height:60px;"><canvas id="chart-jarak-manual"></canvas></div>
        </div>
    </div>

    <div class="card" id="card-relay" style="max-width: 400px; margin: 0 auto 30px;">
        <div class="card-title" style="justify-content: center;"><i class="fas fa-bolt"></i> Aktuator</div>
        <div class="relay-status-box">
            <div class="relay-big-icon"><i class="fas fa-bolt"></i></div>
            <div style="font-weight: 800; font-size: 0.8em; color: #999; margin-top: 10px;">POMPA RELAY (P13)</div>
            <div class="relay-label" id="lbl-relay">OFF</div>
        </div>
        
        <div id="manual-relay" style="display:none; justify-content: center; gap: 10px; align-items: center; padding-top: 15px; border-top: 2px dashed #eee;">
            <span>Manual Control:</span>
            <input type="checkbox" id="sw-relay" onchange="window.toggleRelay(this.checked)" style="width: 25px; height: 25px;">
        </div>
    </div>

    <div class="terminal">
        <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2017.png?raw=true" class="char-tupai tupai-3">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:10px;">
            <span style="color: white; font-weight: 900; letter-spacing: 1px;">SYSTEM LOG</span>
            <button id="btnClearLog" style="background: none; border: 1px solid white; color: white; border-radius: 10px; padding: 2px 10px; cursor: pointer; font-size: 10px;">Clear</button>
        </div>
        <div id="terminalLog" class="log-panel"></div>
        <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20265.png?raw=true" style="position: absolute; bottom: 10px; right: 10px; width: 40px;">
    </div>
</div>

<script type="module">
    // Logic tetap sama agar fungsi Microbit & Firebase tidak rusak
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getDatabase, ref, onValue, update } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    const state = {
        db: null, path: "", bleConnected: false, bleBuffer: "", modeOtomatis: 1, charts: {},
        device: null, txChar: null, rxChar: null
    };

    const $ = id => document.getElementById(id);

    function log(msg, color = "#e0f2f1") {
        const t = new Date().toLocaleTimeString('id-ID', { hour12: false });
        $('terminalLog').insertAdjacentHTML('afterbegin', `<div style="color:${color}; margin-bottom:2px;">> ${msg}</div>`);
    }

    // --- Bluetooth Logic ---
    const SVC = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const TX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const RX  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    async function connectBLE() {
        try {
            state.device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: "BBC micro:bit" }],
                optionalServices: [SVC]
            });
            const server = await state.device.gatt.connect();
            const service = await server.getPrimaryService(SVC);
            state.txChar = await service.getCharacteristic(TX);
            state.rxChar = await service.getCharacteristic(RX);
            await state.txChar.startNotifications();
            state.txChar.addEventListener("characteristicvaluechanged", (e) => {
                let decoder = new TextDecoder();
                state.bleBuffer += decoder.decode(e.target.value);
                const lines = state.bleBuffer.split('\n');
                state.bleBuffer = lines.pop();
                lines.forEach(l => {
                    const [k, v] = l.trim().split(',');
                    const val = parseFloat(v);
                    if(k === "jarak") updateSensorUI("jarak", val);
                    if(k === "jarak_manual") updateSensorUI("jarak_manual", val);
                    if(k === "Relay") updateRelayUI(val === 1);
                });
            });
            state.bleConnected = true;
            $('status-bt').innerText = "Connected";
            $('status-bt').style.color = "#4caf50";
            log("Micro:bit Connected!", "#81c784");
        } catch (e) { log("Error: " + e.message, "#ff8a80"); }
    }

    function updateSensorUI(key, val) {
        const el = key === 'jarak_manual' ? $('val-jarak-manual') : $('val-jarak');
        if (el) el.innerHTML = `${val}<span class="sensor-unit">cm</span>`;
        if (key === 'jarak_manual' && val > 30) $('alertEmber').classList.add('show');
        else if (key === 'jarak_manual') $('alertEmber').classList.remove('show');
        pushHistory(key, val);
    }

    function updateRelayUI(isOn) {
        if(isOn) $('card-relay').classList.add('on'); 
        else $('card-relay').classList.remove('on');
        $('lbl-relay').textContent = isOn ? 'ON' : 'OFF';
        $('sw-relay').checked = isOn;
    }

    function applyMode(isAuto) {
        state.modeOtomatis = isAuto ? 1 : 0;
        $('modePill').innerText = `MODE: ${isAuto ? 'OTOMATIS' : 'MANUAL'}`;
        $('manual-relay').style.display = isAuto ? 'none' : 'flex';
    }

    // --- Firebase & Charts ---
    $('btn-connect-fb').onclick = async () => {
        const config = { apiKey: $('fb-apiKey').value, databaseURL: $('fb-dbUrl').value };
        const app = initializeApp(config);
        state.db = getDatabase(app);
        state.path = $('fb-path').value;
        onValue(ref(state.db, state.path), (s) => {
            const d = s.val();
            if(d) {
                if(d.jarak) updateSensorUI("jarak", d.jarak.value);
                if(d.jarak_manual) updateSensorUI("jarak_manual", d.jarak_manual.value);
                if(d.relay) updateRelayUI(d.relay.value === 1);
            }
        });
        log("Firebase Connected!", "#81c784");
    };

    function initCharts() {
        const cfg = (col) => ({
            type: 'line',
            data: { labels: [], datasets: [{ data: [], borderColor: col, fill: false, tension: 0.4, pointRadius: 0 }] },
            options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
        });
        state.charts.jarak = new Chart($('chart-jarak'), cfg('#5c6bc0'));
        state.charts.jarak_manual = new Chart($('chart-jarak-manual'), cfg('#4db6ac'));
    }

    function pushHistory(key, val) {
        const ch = state.charts[key];
        if (!ch) return;
        ch.data.labels.push("");
        ch.data.datasets[0].data.push(val);
        if (ch.data.labels.length > 20) { ch.data.labels.shift(); ch.data.datasets[0].data.shift(); }
        ch.update('none');
    }

    $('btn-connect-ble').onclick = connectBLE;
    $('btnToggleMode').onclick = () => applyMode(state.modeOtomatis === 0);
    $('btnClearLog').onclick = () => $('terminalLog').innerHTML = '';
    window.onload = initCharts;
</script>
</body>
</html>
