<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Crossing Hidroponik 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #e0f7fa 0%, #f1f8e9 45%, #fff9c4 100%);
            --accent-teal: #26a69a;
            --accent-green: #66bb6a;
            --text-color: #263238;
            --panel-bg: rgba(255, 255, 255, 0.92);
            --border-radius: 32px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            padding: 20px 12px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Dekorasi Samping (Stretched Stack) --- */
        .side-decor-stack {
            position: fixed;
            top: 50px;    /* Jarak dari atas layar agar sejajar logo */
            bottom: 50px; /* Jarak dari bawah layar */
            height: 85vh; /* Mengambil hampir seluruh tinggi layar */
            z-index: 1;
            display: flex;
            flex-direction: column-reverse; /* Susunan: Bawah -> Tengah -> Atas */
            justify-content: space-between; /* Memberikan space maksimal antar elemen */
            align-items: center;
            width: 100px;
        }

        .side-decor-stack img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.12));
        }

        /* Space kiri & kanan tetap 40px agar lega */
        .left-stack { left: 40px; }
        .right-stack { right: 40px; }

        /* Animasi Daun Melayang */
        @keyframes leafFloat {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        .anim-leaf { animation: leafFloat 3.5s ease-in-out infinite; }

        /* --- Layout Utama --- */
        .wrapper { max-width: 900px; margin: 0 auto; position: relative; z-index: 2; }
        .header { text-align: center; margin: 60px 0 35px; }
        .logo-container { position: relative; display: inline-block; width: 300px; }
        .logo-main { width: 100%; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.12)); position: relative; z-index: 2; }
        .header-squirrel { position: absolute; width: 85px; z-index: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }
        .sq-yellow { top: -40px; left: 5px; }
        .sq-red { top: -60px; left: 50%; transform: translateX(-50%); }
        .sq-blue { top: -40px; right: 5px; }

        /* --- Komponen Dashboard --- */
        .status-fixed { position: fixed; top: 15px; right: 15px; z-index: 100; display: flex; flex-direction: column; gap: 6px; }
        .badge { background: white; padding: 6px 16px; border-radius: 30px; font-size: 0.82em; font-weight: 900; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #eee; }
        .badge.online { color: var(--accent-green); border: 2px solid var(--accent-green); }

        .grid-main { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; margin-bottom: 28px; }
        .card { background: var(--panel-bg); border-radius: var(--border-radius); padding: 26px; border: 5px solid white; box-shadow: 0 12px 35px rgba(0,0,0,0.08); }
        .card-title { font-size: 0.85em; font-weight: 900; text-transform: uppercase; color: var(--accent-teal); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        
        input { width: 100%; padding: 13px 18px; border-radius: 22px; border: 2px solid #e0f2f1; margin-bottom: 14px; font-weight: 700; outline: none; }
        .btn { width: 100%; padding: 14px; border-radius: 28px; border: none; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: white; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        .btn-fb { background: #4db6ac; }
        .btn-ble { background: #26a69a; }

        .sensor-val { font-size: 2.8em; font-weight: 900; line-height: 1; margin: 10px 0; }
        .sensor-unit { font-size: 0.5em; color: #78909c; }
        .chart-container { height: 70px; margin-top: 10px; }

        .relay-card { text-align: center; margin-bottom: 30px; }
        .relay-status { font-size: 3em; font-weight: 900; margin: 10px 0; }
        .relay-card.on .relay-status { color: var(--accent-green); }

        .terminal-container { background: #00695c; border-radius: var(--border-radius); padding: 24px; border: 5px solid white; color: white; margin-bottom: 40px; }
        .log-screen { height: 150px; overflow-y: auto; font-family: 'Space Mono', monospace; font-size: 11px; background: rgba(0,0,0,0.15); border-radius: 20px; padding: 12px; }
        
        .mode-box { background: white; display: inline-flex; padding: 8px; border-radius: 40px; border: 4px solid #e0f2f1; }
        .mode-btn { padding: 10px 30px; border: none; border-radius: 30px; font-weight: 800; cursor: pointer; background: transparent; color: #78909c; }
        .mode-btn.active { background: var(--accent-teal); color: white; box-shadow: 0 5px 12px rgba(38, 166, 154, 0.3); }

        @media (max-width: 1100px) {
            .side-decor-stack { width: 70px; left: 15px; right: 15px; }
        }
        @media (max-width: 900px) {
            .side-decor-stack { display: none; } /* Hilangkan dekorasi di HP agar tidak mengganggu */
        }
    </style>
</head>
<body>

<div class="side-decor-stack left-stack">
    <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%2012.png" style="width: 80%;" alt="Takoyaki">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%209.png?raw=true" style="width: 60%;" alt="Koin">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2019.png?raw=true" alt="IJASUKATUPAI">
</div>

<div class="side-decor-stack right-stack">
    <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%2016.png" style="width: 80%;" alt="Tupai Krem">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20257.png?raw=true" class="anim-leaf" style="width: 70%;" alt="Daun">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20274.png?raw=true" alt="Biru Mini">
</div>

<div class="status-fixed">
    <div class="badge" id="status-bt">BT OFFLINE</div>
    <div class="badge" id="status-fb">DB OFFLINE</div>
</div>

<div class="wrapper">
    <div class="header">
        <div class="logo-container">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/tupai%20kuning.png?raw=true" class="header-squirrel sq-yellow">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/tupai%20merah.png?raw=true" class="header-squirrel sq-red">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/tupai%20biru.png?raw=true" class="header-squirrel sq-blue">
            <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%203.png" class="logo-main">
        </div>
        <br>
        <div style="margin-top:15px;"><span style="background:white; padding:8px 25px; border-radius:20px; font-weight:800; color:var(--accent-teal); border:2px solid #b2dfdb;">Monitoring & Control Otomatis</span></div>
    </div>

    <div class="grid-main">
        <div class="card">
            <div class="card-title"><i class="fas fa-cloud"></i> Firebase Sync</div>
            <input type="text" id="fb-apiKey" placeholder="API Key">
            <input type="text" id="fb-dbUrl" placeholder="Database URL">
            <button class="btn btn-fb" id="btn-connect-fb">Connect Firebase</button>
        </div>
        <div class="card">
            <div class="card-title"><i class="fab fa-bluetooth"></i> Micro:bit BLE</div>
            <p style="font-size:12px; margin-bottom:15px; color:#90a4ae;">Aktifkan Bluetooth UART di MakeCode.</p>
            <button class="btn btn-ble" id="btn-connect-ble">Connect Microbit</button>
            <button class="btn" id="btn-disconnect-ble" style="display:none; background:#ef5350; margin-top:10px;">Disconnect</button>
        </div>
    </div>

    <div style="text-align:center; margin-bottom:30px;">
        <div class="mode-box">
            <button class="mode-btn" id="mode-manual">Manual</button>
            <button class="mode-btn active" id="mode-auto">Otomatis</button>
        </div>
    </div>

    <div class="grid-main">
        <div class="card">
            <div class="card-title"><i class="fas fa-tint"></i> Tinggi Air</div>
            <div class="sensor-val" id="val-jarak">--<span class="sensor-unit"> CM</span></div>
            <div class="chart-container"><canvas id="chart-jarak"></canvas></div>
        </div>
        <div class="card">
            <div class="card-title"><i class="fas fa-thermometer-half"></i> Suhu Udara</div>
            <div class="sensor-val" style="color:#ef5350;"><span id="val-temp">--</span>°C</div>
            <p style="font-size:12px; color:#90a4ae;">Sensor DHT22 Aktif</p>
        </div>
    </div>

    <div class="card relay-card" id="card-relay">
        <div class="card-title" style="justify-content:center;"><i class="fas fa-bolt"></i> STATUS POMPA</div>
        <div class="relay-status" id="lbl-relay">OFF</div>
        <div id="manual-relay-ui" style="display:none; margin-top:15px; justify-content:center; gap:10px;">
            <button class="btn" style="background:#66bb6a; width:100px;" onclick="manualRelay(1)">ON</button>
            <button class="btn" style="background:#ef5350; width:100px;" onclick="manualRelay(0)">OFF</button>
        </div>
    </div>

    <div class="terminal-container">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:12px; font-weight:bold;">
            <span>SYSTEM LOG</span>
            <span id="btnClearLog" style="cursor:pointer; opacity:0.7;">CLEAR</span>
        </div>
        <div id="terminalLog" class="log-screen"></div>
    </div>
</div>

<script type="module">
    // (Logika JavaScript tetap sama untuk Firebase & Bluetooth)
</script>
</body>
</html>
