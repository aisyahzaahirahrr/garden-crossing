<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Crossing Hidroponik 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #e0f7fa 0%, #f1f8e9 45%, #fff9c4 100%);
            --accent-teal: #26a69a;
            --accent-green: #66bb6a;
            --text-color: #263238;
            --panel-bg: rgba(255, 255, 255, 0.92);
            --border-radius: 32px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            padding: 20px 12px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Dekorasi Samping Posisi Tengah --- */
        .side-decor-stack {
            position: fixed;
            /* Mengatur posisi agar berada di tengah layar secara vertikal */
            top: 50%;
            transform: translateY(-50%); 
            z-index: 1;
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 35px; /* Jarak antar elemen yang pas */
            width: 100px;
        }

        .side-decor-stack img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.12));
        }

        .left-stack { left: 45px; }
        .right-stack { right: 45px; }

        /* --- Animasi Kustom (Tetap Dipertahankan) --- */

        /* Takoyaki Muter */
        @keyframes rotateTakoyaki {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .anim-rotate { animation: rotateTakoyaki 8s linear infinite; }

        /* Koin Besar Kecil */
        @keyframes pulseCoin {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .anim-pulse { animation: pulseCoin 2s ease-in-out infinite; }

        /* Tupai Merah Goyang */
        @keyframes shakeRed {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        .anim-shake { animation: shakeRed 1.5s ease-in-out infinite; }

        /* Tupai Biru Lompat */
        @keyframes jumpBlue {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .anim-jump { animation: jumpBlue 1.2s ease-in-out infinite; }

        /* Daun Melayang */
        @keyframes leafFloat {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        .anim-leaf { animation: leafFloat 3s ease-in-out infinite; }

        /* Tupai Krem Squeeze */
        @keyframes squeezeCream {
            0%, 100% { transform: scaleX(1) scaleY(1); }
            50% { transform: scaleX(1.1) scaleY(0.9); }
        }
        .anim-squeeze { animation: squeezeCream 2s ease-in-out infinite; }

        /* --- UI Utama (Tidak Mengubah Tombol Lain) --- */
        .wrapper { max-width: 900px; margin: 0 auto; position: relative; z-index: 2; }
        .header { text-align: center; margin: 40px 0 35px; }
        .logo-container { position: relative; display: inline-block; width: 280px; }
        .logo-main { width: 100%; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.12)); }
        
        .status-fixed { position: fixed; top: 15px; right: 15px; z-index: 100; display: flex; flex-direction: column; gap: 6px; }
        .badge { background: white; padding: 6px 16px; border-radius: 30px; font-size: 0.82em; font-weight: 900; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #eee; }
        
        @media (max-width: 1200px) {
            .side-decor-stack { width: 80px; left: 15px; right: 15px; gap: 25px; }
        }
        @media (max-width: 1000px) {
            .side-decor-stack { display: none; }
        }
    </style>
</head>
<body>

<div class="side-decor-stack left-stack">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2019.png?raw=true" class="anim-shake" alt="Red">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%209.png?raw=true" class="anim-pulse" style="width: 75%;" alt="Coin">
    <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%2012.png" class="anim-rotate" style="width: 85%;" alt="Takoyaki">
</div>

<div class="side-decor-stack right-stack">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20274.png?raw=true" class="anim-jump" alt="Blue">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20257.png?raw=true" class="anim-leaf" style="width: 80%;" alt="Leaf">
    <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%2016.png" class="anim-squeeze" style="width: 85%;" alt="Cream">
</div>

<div class="status-fixed">
    <div class="badge">BT OFFLINE</div>
    <div class="badge">DB OFFLINE</div>
</div>

<div class="wrapper">
    <div class="header">
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%203.png" class="logo-main">
        </div>
    </div>
    </div>

</body>
</html>
