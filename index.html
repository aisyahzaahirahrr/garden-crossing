<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Crossing Hidroponik 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --bg-teal: #4db6ac; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(180deg, #d1f2eb 0%, #f9fbe7 100%);
            min-height: 100vh; padding: 20px; overflow-x: hidden;
        }

        .wrapper { max-width: 900px; margin: 0 auto; position: relative; }

        /* --- HEADER SECTION --- */
        .header { text-align: center; margin-bottom: 50px; position: relative; padding-top: 60px; }
        
        /* Tupai POLOS di atas logo (Tanpa Nama) */
        .top-squad { position: absolute; top: 0; left: 50%; transform: translateX(-50%); display: flex; gap: 25px; }
        .top-squad img { width: 60px; } 

        .logo-main { width: 380px; max-width: 95%; position: relative; z-index: 2; }
        .tagline { 
            background: #4db6ac; color: white; padding: 10px 30px; 
            border-radius: 50px; display: inline-block; font-weight: 800; 
            margin-top: -10px; position: relative; z-index: 3;
            box-shadow: 0 4px 0 #3b8e86;
        }

        /* --- CARDS --- */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { 
            background: white; border-radius: 35px; padding: 25px; 
            border: 5px solid #fff; position: relative; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.03); 
        }
        .card-title { 
            color: var(--bg-teal); font-weight: 900; font-size: 0.85em; 
            text-transform: uppercase; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; 
        }

        .btn { 
            background: var(--bg-teal); color: white; border: none; padding: 12px; 
            border-radius: 50px; font-weight: 800; cursor: pointer; width: 100%; 
            box-shadow: 0 5px 0 #3b8e86; margin-top: 10px;
        }

        /* --- TUPAI BERNAMA (Aset asli dari foto) --- */
        .char-asset { position: absolute; z-index: 10; pointer-events: none; }
        
        /* Napzz (Kuning) di samping Ultrasonic 2 */
        .char-napzz { width: 110px; bottom: -20px; right: -40px; }
        
        /* Aisyhz (Biru) di bawah Aktuator */
        .char-aisyhz { width: 120px; bottom: -45px; left: 55%; }
        
        /* ijasukatupai (Merah) di pojok Terminal */
        .char-ija { width: 130px; bottom: -20px; left: -50px; }

        /* --- ELEMENT LAIN --- */
        .sensor-val { font-size: 3.5em; font-weight: 900; text-align: center; color: #546e7a; padding: 10px 0; }
        
        .terminal { 
            background: #00897b; border-radius: 35px; padding: 25px; 
            color: white; position: relative; margin-top: 60px; min-height: 180px; 
            border: 6px solid #fff;
        }

        /* Dekorasi Tambahan */
        .asset-deco { position: absolute; pointer-events: none; }
        .leaf { top: 120px; left: 20px; width: 50px; }
        .coin { top: 140px; right: 30px; width: 40px; }
        .shovel { bottom: 20px; right: 20px; width: 55px; }

    </style>
</head>
<body>

<div class="wrapper">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector.png?raw=true" class="asset-deco leaf">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20257.png?raw=true" class="asset-deco coin">

    <div class="header">
        <div class="top-squad">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2018.png?raw=true">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2017.png?raw=true">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2019.png?raw=true">
        </div>
        <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%203.png?raw=true" class="logo-main">
        <br>
        <div class="tagline">Monitoring & control automatic</div>
    </div>

    <div class="grid-2">
        <div class="card">
            <div class="card-title"><i class="fas fa-cloud"></i> Firebase Sync</div>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <div style="height:35px; background:#f5f5f5; border-radius:10px;"></div>
                <div style="height:35px; background:#f5f5f5; border-radius:10px;"></div>
            </div>
            <button class="btn">Hubungkan</button>
        </div>
        
        <div class="card">
            <div class="card-title"><i class="fas fa-microchip"></i> Micro:bit BLE</div>
            <div style="height: 100px; border: 3px dashed #b2dfdb; border-radius: 20px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center;">
                <i class="fab fa-bluetooth-b" style="font-size: 2em; color: #e0f2f1;"></i>
            </div>
            <button class="btn">Connect</button>
        </div>
    </div>

    <div class="grid-2">
        <div class="card">
            <div class="card-title"><i class="fas fa-tint"></i> Ultrasonic 1</div>
            <div class="sensor-val">-- <span style="font-size: 0.4em; color: #ccc;">CM</span></div>
        </div>
        
        <div class="card">
            <div class="card-title"><i class="fas fa-water"></i> Ultrasonic 2</div>
            <div class="sensor-val" style="color: var(--bg-teal);">-- <span style="font-size: 0.4em; color: #ccc;">CM</span></div>
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/image_0d22f4.png?raw=true" class="char-asset char-napzz" style="clip-path: inset(0 33% 0 33%); transform: scale(3);"> 
            </div>
    </div>

    <div class="card" style="max-width: 450px; margin: 40px auto; text-align: center;">
        <div class="card-title" style="justify-content: center;"><i class="fas fa-bolt"></i> Aktuator</div>
        <i class="fas fa-bolt" style="font-size: 5em; color: #eceff1; margin: 15px 0;"></i>
        <div style="font-weight: 900; font-size: 2.5em; color: #cfd8dc;">OFF</div>
        
        <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/image_0d2eb3.png?raw=true" class="char-asset char-aisyhz">
    </div>

    <div class="terminal">
        <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/image_0d2e79.png?raw=true" class="char-asset char-ija">
        
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <div style="width:12px; height:12px; border-radius:50%; background:#ff5252;"></div>
            <div style="width:12px; height:12px; border-radius:50%; background:#ffca28;"></div>
            <div style="width:12px; height:12px; border-radius:50%; background:#4caf50;"></div>
            <span style="font-size: 11px; opacity: 0.7; margin-left: 10px; font-family: 'Space Mono';">system_terminal - smartgardenmicrobit</span>
        </div>
        
        <div style="background: rgba(255,255,255,0.05); height: 80px; border-radius: 15px;"></div>
        
        <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20265.png?raw=true" class="asset-deco shovel">
    </div>
</div>

</body>
</html>
