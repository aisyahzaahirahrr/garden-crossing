<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Crossing Hidroponik 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #e0f7fa 0%, #f1f8e9 45%, #fff9c4 100%);
            --accent-teal: #26a69a;
            --accent-green: #66bb6a;
            --text-color: #263238;
            --panel-bg: rgba(255, 255, 255, 0.92);
            --border-radius: 32px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            padding: 20px 12px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Dekorasi Samping (Adjusted Position) --- */
        .side-decor-stack {
            position: fixed;
            top: 80px;    /* Diturunkan agar tidak mentok ke badge DB Offline */
            bottom: 30px; 
            height: calc(100vh - 110px); /* Menyesuaikan tinggi sisa layar */
            z-index: 1;
            display: flex;
            flex-direction: column-reverse; 
            justify-content: space-between; 
            align-items: center;
            width: 110px;
        }

        .side-decor-stack img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.12));
        }

        .left-stack { left: 40px; }
        .right-stack { right: 40px; }

        @keyframes leafFloat {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        .anim-leaf { animation: leafFloat 3.5s ease-in-out infinite; }

        /* --- Header & Layout --- */
        .wrapper { max-width: 900px; margin: 0 auto; position: relative; z-index: 2; }
        .header { text-align: center; margin: 50px 0 35px; }
        .logo-container { position: relative; display: inline-block; width: 280px; }
        .logo-main { width: 100%; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.12)); }
        
        /* Status Badge (Tetap di pojok paling atas) */
        .status-fixed { position: fixed; top: 15px; right: 15px; z-index: 100; display: flex; flex-direction: column; gap: 6px; }
        .badge { background: white; padding: 6px 16px; border-radius: 30px; font-size: 0.82em; font-weight: 900; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #eee; }
        
        .grid-main { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card { background: var(--panel-bg); border-radius: var(--border-radius); padding: 25px; border: 5px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        .card-title { font-size: 0.85em; font-weight: 900; text-transform: uppercase; color: var(--accent-teal); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        
        input { width: 100%; padding: 12px 18px; border-radius: 20px; border: 2px solid #e0f2f1; margin-bottom: 12px; font-weight: 700; outline: none; }
        .btn { width: 100%; padding: 14px; border-radius: 28px; border: none; font-weight: 900; cursor: pointer; color: white; transition: 0.2s; }
        .btn-fb { background: #4db6ac; }
        .btn-ble { background: #26a69a; }

        .sensor-val { font-size: 2.8em; font-weight: 900; margin: 10px 0; }
        
        .terminal-container { background: #00695c; border-radius: var(--border-radius); padding: 20px; border: 5px solid white; color: white; }
        .log-screen { height: 140px; overflow-y: auto; font-family: 'Space Mono', monospace; font-size: 11px; background: rgba(0,0,0,0.1); border-radius: 15px; padding: 10px; }

        @media (max-width: 1200px) {
            .side-decor-stack { width: 80px; left: 15px; right: 15px; }
        }
        @media (max-width: 950px) {
            .side-decor-stack { display: none; }
        }
    </style>
</head>
<body>

<div class="side-decor-stack left-stack">
    <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%2012.png" style="width: 85%;" alt="Takoyaki">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%209.png?raw=true" style="width: 70%;" alt="Koin">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2019.png?raw=true" alt="IJASUKATUPAI">
</div>

<div class="side-decor-stack right-stack">
    <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%2016.png" style="width: 85%;" alt="Tupai Krem">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20257.png?raw=true" class="anim-leaf" style="width: 80%;" alt="Daun">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20274.png?raw=true" alt="Biru Mini">
</div>

<div class="status-fixed">
    <div class="badge" id="status-bt">BT OFFLINE</div>
    <div class="badge" id="status-fb">DB OFFLINE</div>
</div>

<div class="wrapper">
    <div class="header">
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%203.png" class="logo-main">
        </div>
        <div style="margin-top:15px;"><span style="background:white; padding:6px 20px; border-radius:20px; font-weight:800; color:var(--accent-teal); font-size: 0.9em; border: 2px solid #b2dfdb;">Monitoring & Control Otomatis</span></div>
    </div>

    </div>

</body>
</html>
