<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Crossing Hidroponik 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #e0f7fa 0%, #f1f8e9 50%, #fff9c4 100%);
            --accent-teal: #4db6ac;
            --accent-green: #81c784;
            --text-main: #2d5a27;
            --border-radius: 40px;
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 20px;
            overflow-x: hidden;
        }

        .wrapper { max-width: 950px; margin: 0 auto; position: relative; padding-top: 20px; }

        /* ===== ASET DEKORASI (GITHUB) ===== */
        .decor { position: absolute; pointer-events: none; z-index: 10; }
        .decor-squirrel { width: 120px; top: -10px; right: -30px; } /* Group 12 / 16 */
        .decor-tree { width: 80px; bottom: 20px; left: -50px; } /* Group 17 */
        .decor-fruit { width: 40px; }

        /* ===== HEADER ===== */
        .header { text-align: center; margin-bottom: 40px; position: relative; }
        .logo-img { width: 280px; margin-bottom: 10px; } /* Placeholder untuk Group 3/Logo */
        .header h1 { font-size: 3.5em; font-weight: 900; color: #a1887f; text-shadow: 3px 3px 0 #fff; line-height: 1; }
        .subtitle { 
            background: var(--accent-teal); color: white; padding: 5px 25px; 
            border-radius: 20px; display: inline-block; font-weight: 800; margin-top: 10px;
            box-shadow: 0 4px 0 #00897b;
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            border: 4px solid #ffffff;
            padding: 25px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.03);
            position: relative;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 0.85em; font-weight: 900; color: var(--accent-teal);
            margin-bottom: 15px; display: flex; align-items: center; gap: 10px;
            text-transform: uppercase;
        }

        /* ===== GRID ===== */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        /* ===== FORM ELEMENTS ===== */
        input {
            width: 100%; padding: 12px 20px; border-radius: 25px; border: 2px solid #e0f2f1;
            margin-bottom: 10px; font-family: inherit; font-weight: 700; outline: none;
        }
        .btn {
            background: var(--accent-teal); color: white; border: none; padding: 12px;
            border-radius: 25px; font-weight: 800; cursor: pointer; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 0 #00897b; transition: 0.2s;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #00897b; }
        .btn-dark { background: #546e7a; box-shadow: 0 4px 0 #37474f; }

        /* ===== SENSOR & RELAY ===== */
        .sensor-val { font-size: 3.5em; font-weight: 900; color: #5c6bc0; line-height: 1; }
        .sensor-unit { font-size: 0.4em; color: #9e9e9e; vertical-align: middle; }
        .relay-status { font-size: 2.5em; font-weight: 900; color: #ccc; }
        .relay-card.on .relay-status { color: var(--accent-green); }
        .relay-card.on .fa-bolt { color: #fbc02d; }

        /* ===== TERMINAL ===== */
        .terminal { background: #009688; border-radius: 30px; padding: 20px; border: 4px solid #fff; }
        .log-panel { height: 120px; overflow-y: auto; color: #e0f2f1; font-family: 'Space Mono', monospace; font-size: 11px; }

        /* Mode Toggle */
        .mode-wrap { text-align: center; margin-bottom: 20px; }
        .mode-btn { 
            background: white; padding: 10px 25px; border-radius: 30px; 
            border: none; font-weight: 800; color: var(--accent-teal); cursor: pointer;
            box-shadow: 0 4px 0 #ddd;
        }

        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>

    <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%2017.png" style="width:100px; bottom:100px; left:-40px;" class="decor" alt="tree">
