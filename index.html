<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Crossing Hidroponik 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #e0f7fa 0%, #f1f8e9 45%, #fff9c4 100%);
            --accent-teal: #26a69a;
            --accent-green: #66bb6a;
            --text-color: #263238;
            --panel-bg: rgba(255, 255, 255, 0.92);
            --border-radius: 32px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            padding: 20px 12px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Dekorasi Samping Posisi Tengah & Animasi --- */
        .side-decor-stack {
            position: fixed;
            top: 55%; 
            transform: translateY(-50%); 
            z-index: 1;
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 35px;
            width: 100px;
        }

        .side-decor-stack img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.12));
        }

        .left-stack { left: 45px; }
        .right-stack { right: 45px; }

        /* Keyframes Animasi */
        @keyframes rotateTako { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .anim-rotate { animation: rotateTako 8s linear infinite; }

        @keyframes pulseCoin { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        .anim-pulse { animation: pulseCoin 2s ease-in-out infinite; }

        @keyframes shakeRed { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
        .anim-shake { animation: shakeRed 1.5s ease-in-out infinite; }

        @keyframes jumpBlue { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .anim-jump { animation: jumpBlue 1.2s ease-in-out infinite; }

        @keyframes leafFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(5deg); } }
        .anim-leaf { animation: leafFloat 3s ease-in-out infinite; }

        @keyframes squeezeCream { 0%, 100% { transform: scaleX(1) scaleY(1); } 50% { transform: scaleX(1.1) scaleY(0.9); } }
        .anim-squeeze { animation: squeezeCream 2s ease-in-out infinite; }

        /* --- UI Utama --- */
        .wrapper { max-width: 960px; margin: 0 auto; position: relative; z-index: 2; }
        .header { text-align: center; margin: 60px 0 35px; }
        .logo-container { position: relative; display: inline-block; width: 320px; }
        .logo-main { width: 100%; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.12)); position: relative; z-index: 2; }
        
        .header-squirrel { position: absolute; width: 90px; z-index: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }
        .sq-yellow { top: -45px; left: 5px; }
        .sq-red { top: -65px; left: 50%; transform: translateX(-50%); }
        .sq-blue { top: -45px; right: 5px; }

        .status-fixed { position: fixed; top: 15px; right: 15px; z-index: 100; display: flex; flex-direction: column; gap: 6px; }
        .badge { background: white; padding: 6px 16px; border-radius: 30px; font-size: 0.82em; font-weight: 900; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #eee; }
        
        .grid-main { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; margin-bottom: 28px; }
        .card { background: var(--panel-bg); border-radius: var(--border-radius); padding: 26px; border: 5px solid white; box-shadow: 0 12px 35px rgba(0,0,0,0.08); }
        .card-title { font-size: 0.85em; font-weight: 900; text-transform: uppercase; color: var(--accent-teal); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        
        label { font-size: 11px; font-weight: 800; color: #90a4ae; margin-left: 10px; text-transform: uppercase; display: block; margin-top: 10px; }
        input { width: 100%; padding: 13px 18px; border-radius: 22px; border: 2px solid #e0f2f1; margin-bottom: 5px; font-weight: 700; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent-teal); }
        
        .btn { width: 100%; padding: 14px; border-radius: 28px; border: none; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: white; transition: 0.2s; box-shadow: 0 4px 0 rgba(0,0,0,0.1); margin-top: 15px; }
        .btn-fb { background: #4db6ac; }
        .btn-ble { background: #26a69a; }

        .sensor-val { font-size: 3.1em; font-weight: 900; line-height: 1; margin: 12px 0; }
        .sensor-unit { font-size: 0.45em; color: #78909c; }
        
        .terminal-container { background: #00695c; border-radius: var(--border-radius); padding: 24px; border: 5px solid white; color: white; margin-bottom: 40px; }
        .log-screen { height: 160px; overflow-y: auto; font-family: 'Space Mono', monospace; font-size: 12px; background: rgba(0,0,0,0.15); border-radius: 20px; padding: 12px; }

        @media (max-width: 1000px) { .side-decor-stack { display: none; } }
    </style>
</head>
<body>

<div class="side-decor-stack left-stack">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2019.png?raw=true" class="anim-shake" alt="Red">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%209.png?raw=true" class="anim-pulse" style="width: 75%;" alt="Coin">
    <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%2012.png" class="anim-rotate" style="width: 85%;" alt="Takoyaki">
</div>

<div class="side-decor-stack right-stack">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20274.png?raw=true" class="anim-jump" alt="Blue">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20257.png?raw=true" class="anim-leaf" style="width: 80%;" alt="Leaf">
    <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%2016.png" class="anim-squeeze" style="width: 85%;" alt="Cream">
</div>

<div class="status-fixed">
    <div class="badge" id="status-bt" style="color:#ef5350;">BT OFFLINE</div>
    <div class="badge" id="status-fb" style="color:#ef5350;">DB OFFLINE</div>
</div>

<div class="wrapper">
    <div class="header">
        <div class="logo-container">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/tupai%20kuning.png?raw=true" class="header-squirrel sq-yellow">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/tupai%20merah.png?raw=true" class="header-squirrel sq-red">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/tupai%20biru.png?raw=true" class="header-squirrel sq-blue">
            <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%203.png" class="logo-main">
        </div>
        <br>
        <div style="margin-top:15px;"><span style="background:white; padding:8px 30px; border-radius:20px; font-weight:800; color:var(--accent-teal); border:3px solid #b2dfdb;">Monitoring & Control Otomatis</span></div>
    </div>

    <div class="grid-main">
        <div class="card">
            <div class="card-title"><i class="fas fa-cloud"></i> Firebase Cloud</div>
            <label>Database URL</label>
            <input type="text" id="fb-dbUrl" placeholder="https://project-id.firebaseio.com">
            <label>Node Path</label>
            <input type="text" id="fb-nodePath" placeholder="monitoring/kebun">
            <button class="btn btn-fb" id="btn-connect-fb">Connect Firebase</button>
        </div>
        <div class="card">
            <div class="card-title"><i class="fab fa-bluetooth"></i> Micro:bit BLE</div>
            <p style="font-size:12px; margin:15px 0; color:#90a4ae;">Gunakan Chrome & HTTPS untuk koneksi Bluetooth.</p>
            <button class="btn btn-ble" id="btn-connect-ble">Connect Microbit</button>
        </div>
    </div>

    <div class="grid-main">
        <div class="card">
            <div class="card-title"><i class="fas fa-tint"></i> Jarak Air</div>
            <div class="sensor-val" id="val-jarak">--<span class="sensor-unit"> CM</span></div>
        </div>
        <div class="card">
            <div class="card-title"><i class="fas fa-thermometer-half"></i> Suhu Udara</div>
            <div class="sensor-val" style="color:#ef5350;"><span id="val-temp">--</span>°C</div>
        </div>
    </div>

    <div class="card" style="text-align:center; margin-bottom:30px;">
        <div class="card-title" style="justify-content:center;"><i class="fas fa-bolt"></i> STATUS POMPA</div>
        <div class="relay-status" id="lbl-relay" style="font-size:3em; font-weight:900; color:#90a4ae;">OFF</div>
    </div>

    <div class="terminal-container">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-weight:900; font-size:13px;">
            <span>SYSTEM LOG</span>
            <span id="btnClearLog" style="cursor:pointer; opacity:0.7;">CLEAR</span>
        </div>
        <div id="terminalLog" class="log-screen"></div>
    </div>
</div>

<script>
    // --- VARIABEL & KONFIGURASI ---
    let bluetoothDevice;
    let terminalLog = document.getElementById('terminalLog');
    let btnConnectBle = document.getElementById('btn-connect-ble');
    let btnConnectFb = document.getElementById('btn-connect-fb');
    
    let isFirebaseConnected = false;
    let fbURL = "";
    let fbPath = "";

    function logToTerminal(msg) {
        let p = document.createElement('p');
        p.textContent = `> ${msg}`;
        terminalLog.appendChild(p);
        terminalLog.scrollTop = terminalLog.scrollHeight;
    }

    // --- 1. LOGIKA FIREBASE ---
    btnConnectFb.addEventListener('click', () => {
        fbURL = document.getElementById('fb-dbUrl').value.trim();
        fbPath = document.getElementById('fb-nodePath').value.trim();

        if (!fbURL || !fbPath) {
            logToTerminal("ERROR: Database URL & Node Path harus diisi!");
            return;
        }

        if (!fbURL.endsWith('/')) fbURL += '/';
        
        isFirebaseConnected = true;
        logToTerminal("Firebase Aktif! Menunggu data Bluetooth...");
        
        document.getElementById('status-fb').textContent = "DB ONLINE";
        document.getElementById('status-fb').style.color = "#26a69a";
        btnConnectFb.style.backgroundColor = "#81c784";
        btnConnectFb.textContent = "Firebase Connected!";
    });

    async function sendToFirebase(key, value) {
        if (!isFirebaseConnected) return;
        const targetURL = `${fbURL}${fbPath}/${key}.json`;
        try {
            await fetch(targetURL, {
                method: 'PUT',
                body: JSON.stringify(value)
            });
        } catch (e) { console.error("FB Error:", e); }
    }

    // --- 2. LOGIKA PARSING DATA (DARI MICROBIT) ---
    function processIncomingData(dataRaw) {
        let data = dataRaw.trim();

        // Format J (Jarak)
        if (data.startsWith('J')) {
            let val = data.substring(1); 
            document.getElementById('val-jarak').innerHTML = `${val}<span class="sensor-unit"> CM</span>`;
            sendToFirebase("jarak", val);
        } 
        // Format T (Suhu)
        else if (data.startsWith('T')) {
            let val = data.substring(1);
            document.getElementById('val-temp').textContent = val;
            sendToFirebase("suhu", val);
        }
        // Format P (Pompa)
        else if (data.startsWith('P')) {
            let val = data.substring(1);
            let lbl = document.getElementById('lbl-relay');
            let statusText = (val === "1") ? "ON" : "OFF";
            
            lbl.textContent = statusText;
            lbl.style.color = (val === "1") ? "#26a69a" : "#ef5350";
            sendToFirebase("pompa", statusText);
        }
    }

    // --- 3. LOGIKA BLUETOOTH ---
    btnConnectBle.addEventListener('click', async () => {
        try {
            logToTerminal("Mencari Micro:bit...");
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'BBC micro:bit' }],
                optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
            });

            logToTerminal("Menghubungkan ke Bluetooth...");
            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
            const characteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');

            await characteristic.startNotifications();
            logToTerminal("Bluetooth Terhubung!");
            
            document.getElementById('status-bt').textContent = "BT ONLINE";
            document.getElementById('status-bt').style.color = "#26a69a";

            characteristic.addEventListener('characteristicvaluechanged', (event) => {
                let decoder = new TextDecoder('utf-8');
                let rawString = decoder.decode(event.target.value);
                logToTerminal(rawString); // Munculkan di log
                processIncomingData(rawString); // Update UI & Firebase
            });

        } catch (error) {
            logToTerminal("Gagal Koneksi: " + error);
        }
    });

    document.getElementById('btnClearLog').addEventListener('click', () => terminalLog.innerHTML = "");
</script>
</body>
</html>
