<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Crossing Hidroponik 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --bg-teal: #4db6ac; --text-brown: #8d6e63; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(180deg, #d1f2eb 0%, #f9fbe7 100%);
            min-height: 100vh; padding: 20px; overflow-x: hidden;
        }
        .wrapper { max-width: 900px; margin: 0 auto; position: relative; }

        /* --- HEADER: Logo + Tupai Tanpa Nama --- */
        .header { text-align: center; margin-bottom: 40px; position: relative; padding-top: 60px; }
        .top-squad { position: absolute; top: 0; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; }
        .top-squad img { width: 55px; } /* */
        .logo-main { width: 350px; max-width: 90%; } /* */
        .tagline { background: #4db6ac; color: white; padding: 8px 25px; border-radius: 50px; display: inline-block; font-weight: 800; margin-top: 10px; }

        /* --- CARDS --- */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: white; border-radius: 30px; padding: 20px; border: 4px solid #fff; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .card-title { color: var(--bg-teal); font-weight: 900; font-size: 0.8em; text-transform: uppercase; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        input { width: 100%; padding: 10px; border-radius: 15px; border: 2px solid #e0f2f1; margin-bottom: 8px; font-family: inherit; }
        .btn { background: var(--bg-teal); color: white; border: none; padding: 10px; border-radius: 50px; font-weight: 800; cursor: pointer; width: 100%; box-shadow: 0 4px 0 #3b8e86; }

        /* --- TUPAI DENGAN KURSOR (POSISI FIX SESUAI UI) --- */
        .char-with-name { position: absolute; z-index: 10; display: flex; flex-direction: column; align-items: center; }
        .char-img { width: 85px; }
        .cursor-tag { position: relative; margin-left: 40px; margin-top: -20px; }
        .name-label { background: #7e57c2; color: white; padding: 2px 10px; border-radius: 5px; font-size: 10px; font-weight: bold; }
        .name-label.red { background: #ef5350; }

        /* Napzz di Jarak Manual */
        .pos-napzz { bottom: 60px; right: -30px; } /* */
        /* Aisyhz di Aktuator */
        .pos-aisyhz { bottom: -20px; right: -40px; } /* */
        /* Ijasukatupai di Terminal */
        .pos-ija { bottom: -10px; left: -40px; } /* */

        /* --- TERMINAL --- */
        .terminal { background: #00897b; border-radius: 25px; padding: 20px; color: white; position: relative; margin-top: 40px; min-height: 150px; }
        .team-tag { position: absolute; bottom: -12px; left: 50px; background: #ef5350; color: white; padding: 2px 12px; border-radius: 8px; font-size: 12px; font-weight: 900; }
        .shovel { position: absolute; bottom: 10px; right: 10px; width: 45px; }

        .sensor-val { font-size: 3em; font-weight: 900; text-align: center; color: #546e7a; margin: 10px 0; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <div class="top-squad">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2018.png?raw=true">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2017.png?raw=true">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2019.png?raw=true">
        </div>
        <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%203.png?raw=true" class="logo-main"> <br>
        <div class="tagline">Monitoring & control automatic</div>
    </div>

    <div class="grid-2">
        <div class="card">
            <div class="card-title"><i class="fas fa-cloud"></i> Firebase Database</div>
            <input type="text" placeholder="API Key"><input type="text" placeholder="Database URL">
            <button class="btn">Connect</button>
        </div>
        <div class="card">
            <div class="card-title"><i class="fas fa-microchip"></i> Micro:bit BLE</div>
            <div style="height: 80px; border: 2px dashed #b2dfdb; border-radius: 15px; margin-bottom: 10px;"></div>
            <button class="btn">Connect Microbit</button>
        </div>
    </div>

    <div class="grid-2">
        <div class="card">
            <div class="card-title"><i class="fas fa-tint"></i> Ultrasonic 1: Pompa</div>
            <div class="sensor-val">-- CM</div>
        </div>
        <div class="card">
            <div class="card-title"><i class="fas fa-water"></i> Ultrasonic 2: Ember</div>
            <div class="sensor-val">-- CM</div>
            <div class="char-with-name pos-napzz">
                <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2018.png?raw=true" class="char-img"> <div class="cursor-tag">
                    <i class="fas fa-mouse-pointer" style="color: #2196f3; font-size: 14px; position: absolute; top: -10px; left: -10px;"></i>
                    <div class="name-label">NaPzz💤</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card" style="max-width: 400px; margin: 30px auto; text-align: center;">
        <div class="card-title" style="justify-content: center;"><i class="fas fa-bolt"></i> Aktuator</div>
        <i class="fas fa-bolt" style="font-size: 4em; color: #eceff1; margin: 10px 0;"></i>
        <div style="font-weight: 800; font-size: 1.5em; color: #90a4ae;">OFF</div>
        <div class="char-with-name pos-aisyhz">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2019.png?raw=true" class="char-img"> <div class="cursor-tag">
                <i class="fas fa-mouse-pointer" style="color: #7e57c2; font-size: 14px; position: absolute; top: -10px; left: -10px;"></i>
                <div class="name-label">Aisyhz</div>
            </div>
        </div>
    </div>

    <div class="terminal">
        <div class="char-with-name pos-ija">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2017.png?raw=true" class="char-img"> <div class="cursor-tag">
                <i class="fas fa-mouse-pointer" style="color: #ef5350; font-size: 14px; position: absolute; top: -10px; left: -10px;"></i>
                <div class="name-label red">ijasukatupai</div>
            </div>
        </div>
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
            <div style="width:10px; height:10px; border-radius:50%; background:#ff5252;"></div>
            <div style="width:10px; height:10px; border-radius:50%; background:#ffca28;"></div>
            <div style="width:10px; height:10px; border-radius:50%; background:#4caf50;"></div>
            <span style="font-size: 10px; opacity: 0.8; margin-left: 10px;">system_terminal - smartgardenmicrobit</span>
        </div>
        <div class="team-tag">TigaTupai</div>
        <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20265.png?raw=true" class="shovel">
    </div>
</div>

</body>
</html>
