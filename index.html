<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Crossing Hidroponik 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #e0f7fa 0%, #f1f8e9 45%, #fff9c4 100%);
            --accent-teal: #26a69a;
            --accent-green: #66bb6a;
            --text-color: #263238;
            --panel-bg: rgba(255, 255, 255, 0.92);
            --border-radius: 32px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            padding: 20px 12px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Dekorasi Samping (Stack) --- */
        .side-decor-stack {
            position: fixed;
            bottom: 20px;
            z-index: 1;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 20px;
            width: 110px;
        }

        .side-decor-stack img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }

        .left-stack { left: 20px; }
        .right-stack { right: 20px; }

        @keyframes leafFloat {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        .anim-leaf { animation: leafFloat 3s ease-in-out infinite; }

        /* --- Header & Logo --- */
        .wrapper { max-width: 960px; margin: 0 auto; position: relative; z-index: 2; }
        .header { text-align: center; margin: 60px 0 35px; }
        .logo-container { position: relative; display: inline-block; width: 320px; }
        .logo-main { width: 100%; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.12)); position: relative; z-index: 2; }
        .header-squirrel { position: absolute; width: 90px; z-index: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }
        .sq-yellow { top: -45px; left: 5px; }
        .sq-red { top: -65px; left: 50%; transform: translateX(-50%); }
        .sq-blue { top: -45px; right: 5px; }

        /* --- Komponen UI --- */
        .status-fixed { position: fixed; top: 15px; right: 15px; z-index: 100; display: flex; flex-direction: column; gap: 6px; }
        .badge { background: white; padding: 6px 16px; border-radius: 30px; font-size: 0.82em; font-weight: 900; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .badge.online { color: var(--accent-green); border: 2px solid var(--accent-green); }

        /* Grid disesuaikan untuk 2 kartu utama */
        .grid-main { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; margin-bottom: 28px; }
        
        .card { background: var(--panel-bg); border-radius: var(--border-radius); padding: 26px; border: 5px solid white; box-shadow: 0 12px 35px rgba(0,0,0,0.08); }
        .card-title { font-size: 0.85em; font-weight: 900; text-transform: uppercase; color: var(--accent-teal); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        
        label { display: block; font-size: 0.78em; font-weight: 800; margin-bottom: 6px; color: #4db6ac; }
        input { width: 100%; padding: 13px 18px; border-radius: 22px; border: 2px solid #e0f2f1; margin-bottom: 14px; font-weight: 700; outline: none; }
        
        .btn { width: 100%; padding: 14px; border-radius: 28px; border: none; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: white; box-shadow: 0 5px 0 rgba(0,0,0,0.1); transition: 0.2s; }
        .btn-fb { background: #4db6ac; }
        .btn-ble { background: #26a69a; }

        .sensor-val { font-size: 3.1em; font-weight: 900; line-height: 1; margin: 12px 0; }
        .sensor-unit { font-size: 0.45em; color: #78909c; }
        .chart-container { height: 68px; margin-top: 12px; }

        .relay-card { text-align: center; margin-bottom: 30px; }
        .relay-status { font-size: 2.8em; font-weight: 900; margin: 12px 0; }
        .relay-card.on .relay-status { color: var(--accent-green); }

        .terminal-container { background: #00695c; border-radius: var(--border-radius); padding: 24px; border: 5px solid white; color: white; margin-bottom: 40px; }
        .log-screen { height: 160px; overflow-y: auto; font-family: 'Space Mono', monospace; font-size: 12px; background: rgba(0,0,0,0.15); border-radius: 20px; padding: 12px; }
        
        .subtitle-pill { background: white; color: var(--accent-teal); padding: 8px 32px; border-radius: 30px; font-weight: 800; font-size: 1.1em; display: inline-block; margin-top: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); border: 3px solid #b2dfdb; }
        .mode-box { background: white; display: inline-flex; padding: 8px; border-radius: 40px; border: 4px solid #e0f2f1; }
        .mode-btn { padding: 12px 32px; border: none; border-radius: 30px; font-weight: 800; cursor: pointer; background: transparent; color: #78909c; transition: 0.3s; }
        .mode-btn.active { background: var(--accent-teal); color: white; box-shadow: 0 6px 15px rgba(38, 166, 154, 0.3); }

        @media (max-width: 768px) {
            .side-decor-stack { width: 70px; opacity: 0.7; gap: 10px; }
        }
    </style>
</head>
<body>

<div class="side-decor-stack left-stack">
    <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%2012.png" alt="Takoyaki">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%209.png?raw=true" alt="Koin">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2019.png?raw=true" alt="IJASUKATUPAI">
</div>

<div class="side-decor-stack right-stack">
    <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%2016.png" alt="Tupai Krem">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20257.png?raw=true" class="anim-leaf" alt="Daun">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20274.png?raw=true" alt="Biru Mini">
</div>

<div class="status-fixed">
    <div class="badge" id="status-bt">BT OFFLINE</div>
    <div class="badge" id="status-fb">DB OFFLINE</div>
</div>

<div class="wrapper">
    <div class="header">
        <div class="logo-container">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/tupai%20kuning.png?raw=true" class="header-squirrel sq-yellow">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/tupai%20merah.png?raw=true" class="header-squirrel sq-red">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/tupai%20biru.png?raw=true" class="header-squirrel sq-blue">
            <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%203.png" class="logo-main">
        </div>
        <br>
        <div class="subtitle-pill">Monitoring & Control Otomatis</div>
    </div>

    <div class="grid-main" style="grid-template-columns: 1fr 1fr;">
        <div class="card">
            <div class="card-title"><i class="fas fa-cloud"></i> Firebase Cloud Sync</div>
            <label>API KEY</label>
            <input type="text" id="fb-apiKey" placeholder="Masukkan API Key Anda">
            <label>DATABASE URL</label>
            <input type="text" id="fb-dbUrl" placeholder="https://...">
            <label>NODE PATH</label>
            <input type="text" id="fb-path" value="smarthome/ruangan1">
            <button class="btn btn-fb" id="btn-connect-fb"><i class="fas fa-link"></i> Hubungkan Firebase</button>
        </div>
        <div class="card">
            <div class="card-title"><i class="fab fa-bluetooth"></i> Micro:bit Bluetooth</div>
            <p style="font-size: 13px; margin: 18px 0; color: #546e7a;">Pastikan Bluetooth UART aktif di MakeCode</p>
            <button class="btn btn-ble" id="btn-connect-ble"><i class="fab fa-bluetooth-b"></i> Connect Microbit</button>
            <button class="btn" id="btn-disconnect-ble" style="display:none; background:#ef5350;"><i class="fas fa-times"></i> Disconnect</button>
        </div>
    </div>

    <div style="text-align:center; margin:25px 0 35px;">
        <div class="mode-box">
            <button class="mode-btn" id="mode-manual">Manual</button>
            <button class="mode-btn active" id="mode-auto">Otomatis</button>
        </div>
    </div>

    <div class="grid-main">
        <div class="card">
            <div class="card-title"><i class="fas fa-tint"></i> ULTRASONIK 1</div>
            <div class="sensor-val" id="val-jarak">--<span class="sensor-unit"> CM</span></div>
            <div class="sensor-info">Pompa ON jika jarak ≥ 30 cm</div>
            <div class="chart-container"><canvas id="chart-jarak"></canvas></div>
        </div>

        <div class="card">
            <div class="card-title"><i class="fas fa-thermometer-half"></i> DHT22</div>
            <div class="sensor-val" style="font-size:3.1em; color:#ef5350;">
                <span id="val-temp">--</span>°C
            </div>
            <div class="sensor-info">Suhu Udara Terkini</div>
        </div>
    </div>

    <div class="card relay-card" id="card-relay">
        <div class="card-title" style="justify-content:center;"><i class="fas fa-bolt"></i> POMPA RELAY (P13)</div>
        <div class="relay-status" id="lbl-relay">OFF</div>
        <div id="manual-relay-ui" style="display:none; margin-top:20px; justify-content:center; gap:15px;">
            <button class="btn" style="background:#66bb6a; width:auto; padding:12px 40px;" onclick="manualRelay(1)">ON</button>
            <button class="btn" style="background:#ef5350; width:auto; padding:12px 40px;" onclick="manualRelay(0)">OFF</button>
        </div>
    </div>

    <div class="terminal-container">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
            <div style="font-weight:900; font-size:13px;">SYSTEM TERMINAL</div>
            <button id="btnClearLog" style="background:none; border:1px solid rgba(255,255,255,0.6); color:white; border-radius:12px; padding:4px 14px; font-size:11px;">Clear</button>
        </div>
        <div id="terminalLog" class="log-screen"></div>
    </div>
</div>
