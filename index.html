<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Crossing Hidroponik 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #e0f7fa 0%, #f1f8e9 50%, #fff9c4 100%);
            --accent-teal: #4db6ac;
            --accent-green: #81c784;
            --text-main: #2d5a27;
            --border-radius: 40px;
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 20px;
            overflow-x: hidden;
        }

        .wrapper { max-width: 950px; margin: 0 auto; position: relative; padding-top: 20px; }

        /* ===== ASET DEKORASI (GITHUB) ===== */
        .decor { position: absolute; pointer-events: none; z-index: 10; }
        .decor-squirrel { width: 120px; top: -10px; right: -30px; } /* Group 12 / 16 */
        .decor-tree { width: 80px; bottom: 20px; left: -50px; } /* Group 17 */
        .decor-fruit { width: 40px; }

        /* ===== HEADER ===== */
        .header { text-align: center; margin-bottom: 40px; position: relative; }
        .logo-img { width: 280px; margin-bottom: 10px; } /* Placeholder untuk Group 3/Logo */
        .header h1 { font-size: 3.5em; font-weight: 900; color: #a1887f; text-shadow: 3px 3px 0 #fff; line-height: 1; }
        .subtitle { 
            background: var(--accent-teal); color: white; padding: 5px 25px; 
            border-radius: 20px; display: inline-block; font-weight: 800; margin-top: 10px;
            box-shadow: 0 4px 0 #00897b;
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            border: 4px solid #ffffff;
            padding: 25px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.03);
            position: relative;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 0.85em; font-weight: 900; color: var(--accent-teal);
            margin-bottom: 15px; display: flex; align-items: center; gap: 10px;
            text-transform: uppercase;
        }

        /* ===== GRID ===== */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        /* ===== FORM ELEMENTS ===== */
        input {
            width: 100%; padding: 12px 20px; border-radius: 25px; border: 2px solid #e0f2f1;
            margin-bottom: 10px; font-family: inherit; font-weight: 700; outline: none;
        }
        .btn {
            background: var(--accent-teal); color: white; border: none; padding: 12px;
            border-radius: 25px; font-weight: 800; cursor: pointer; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 0 #00897b; transition: 0.2s;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #00897b; }
        .btn-dark { background: #546e7a; box-shadow: 0 4px 0 #37474f; }

        /* ===== SENSOR & RELAY ===== */
        .sensor-val { font-size: 3.5em; font-weight: 900; color: #5c6bc0; line-height: 1; }
        .sensor-unit { font-size: 0.4em; color: #9e9e9e; vertical-align: middle; }
        .relay-status { font-size: 2.5em; font-weight: 900; color: #ccc; }
        .relay-card.on .relay-status { color: var(--accent-green); }
        .relay-card.on .fa-bolt { color: #fbc02d; }

        /* ===== TERMINAL ===== */
        .terminal { background: #009688; border-radius: 30px; padding: 20px; border: 4px solid #fff; }
        .log-panel { height: 120px; overflow-y: auto; color: #e0f2f1; font-family: 'Space Mono', monospace; font-size: 11px; }

        /* Mode Toggle */
        .mode-wrap { text-align: center; margin-bottom: 20px; }
        .mode-btn { 
            background: white; padding: 10px 25px; border-radius: 30px; 
            border: none; font-weight: 800; color: var(--accent-teal); cursor: pointer;
            box-shadow: 0 4px 0 #ddd;
        }

        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="wrapper">
    <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%2012.png" class="decor decor-squirrel" alt="squirrel">
    <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%2017.png" style="width:100px; bottom:100px; left:-40px;" class="decor" alt="tree">

    <div class="header">
        <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%203.png" style="width: 300px;" alt="Garden Crossing">
        <br>
        <div class="subtitle">Monitoring & Control Automatic</div>
    </div>

    <div class="grid-2">
        <div class="card">
            <div class="card-title">
                <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%209.png" class="decor-fruit" alt="icon">
                Firebase Cloud Sync
            </div>
            <input type="password" id="fb-apiKey" placeholder="API Key">
            <input type="text" id="fb-dbUrl" placeholder="Database URL">
            <input type="text" id="fb-path" value="smarthome/ruangan1">
            <button class="btn" id="btn-connect-fb">Hubungkan Firebase</button>
        </div>

        <div class="card">
            <div class="card-title">
                <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%2018.png" class="decor-fruit" alt="icon">
                Micro:bit Bluetooth
            </div>
            <p style="font-size: 11px; margin-bottom: 10px; opacity: 0.7;">Status: <span id="status-bt">Offline</span></p>
            <button class="btn" id="btn-connect-ble">Connect Microbit</button>
            <button class="btn btn-dark" id="btn-disconnect-ble" disabled style="margin-top:8px;">Disconnect</button>
        </div>
    </div>

    <div class="mode-wrap">
        <button class="mode-btn" id="btnToggleMode">MODE: OTOMATIS</button>
    </div>

    <div class="grid-2">
        <div class="card">
            <div class="card-title">Ultrasonik 1 (P0/P1)</div>
            <div class="sensor-val" id="val-jarak">--<span class="sensor-unit">cm</span></div>
            <p style="font-size: 11px; font-weight: 700; color: #81c784;">Pompa Nyala jika ≥ 30cm</p>
            <div style="height:60px; margin-top:10px;"><canvas id="chart-jarak"></canvas></div>
        </div>

        <div class="card">
            <div class="card-title">Ultrasonik 2 (Ember)</div>
            <div class="sensor-val" id="val-jarak-manual" style="color:var(--accent-teal)">--<span class="sensor-unit">cm</span></div>
            <p style="font-size: 11px; font-weight: 700; color: #fbc02d;">Monitoring Level Air Ember</p>
            <div style="height:60px; margin-top:10px;"><canvas id="chart-jarak-manual"></canvas></div>
        </div>
    </div>

    <div class="card relay-card" id="card-relay" style="text-align: center; max-width: 400px; margin: 0 auto 20px;">
        <img src="https://raw.githubusercontent.com/aisyahzaahirahrr/garden-crossing/89b4cc8013761e113366ea2b6522913f620a7760/Group%2019.png" style="width: 80px; margin-bottom: 10px;" alt="relay">
        <div style="font-weight: 900; font-size: 1.2em;">POMPA RELAY (P13)</div>
        <div class="relay-status" id="lbl-relay">OFF</div>
        
        <div id="manual-relay" style="display:none; margin-top:15px;">
            <label style="font-weight: 800; font-size: 0.8em;">KONTROL MANUAL:</label>
            <input type="checkbox" id="sw-relay" onchange="window.toggleRelay(this.checked)" style="width:25px; height:25px; vertical-align:middle;">
        </div>
    </div>

    <div class="terminal">
        <div style="display:flex; justify-content: space-between; margin-bottom:8px;">
            <span style="color:white; font-weight:900; font-size:12px;">SYSTEM LOG</span>
            <button id="btnClearLog" style="background:none; border:1px solid white; color:white; border-radius:10px; padding:2px 8px; font-size:10px; cursor:pointer;">Clear</button>
        </div>
        <div id="terminalLog" class="log-panel"></div>
    </div>
</div>

<script type="module">
// LOGIKA JAVASCRIPT ASLI (TIDAK BERUBAH)
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, onValue, update } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const state = {
    db: null, path: "", device: null, txChar: null, rxChar: null,
    bleConnected: false, bleBuffer: "", modeOtomatis: 1, charts: {}
};

const $ = id => document.getElementById(id);

function log(msg, color = "#e0f2f1") {
    const t = new Date().toLocaleTimeString('id-ID', { hour12: false });
    $('terminalLog').insertAdjacentHTML('afterbegin', `<div style="color:${color}">[${t}] ${msg}</div>`);
}

// Sinkronisasi UI Mode
function applyMode(isAuto) {
    state.modeOtomatis = isAuto ? 1 : 0;
    $('btnToggleMode').innerText = `MODE: ${isAuto ? 'OTOMATIS' : 'MANUAL'}`;
    $('manual-relay').style.display = isAuto ? 'none' : 'block';
    if (state.bleConnected) sendBLE("mode", state.modeOtomatis);
}
$('btnToggleMode').onclick = () => applyMode(state.modeOtomatis === 0);

// Bluetooth Logic
async function connectBLE() {
    try {
        state.device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: "BBC micro:bit" }],
            optionalServices: ["6e400001-b5a3-f393-e0a9-e50e24dcca9e"]
        });
        const server = await state.device.gatt.connect();
        const service = await server.getPrimaryService("6e400001-b5a3-f393-e0a9-e50e24dcca9e");
        state.txChar = await service.getCharacteristic("6e400002-b5a3-f393-e0a9-e50e24dcca9e");
        state.rxChar = await service.getCharacteristic("6e400003-b5a3-f393-e0a9-e50e24dcca9e");
        await state.txChar.startNotifications();
        state.txChar.addEventListener("characteristicvaluechanged", (e) => {
            let decoder = new TextDecoder();
            state.bleBuffer += decoder.decode(e.target.value);
            const lines = state.bleBuffer.split('\n');
            state.bleBuffer = lines.pop();
            lines.forEach(line => {
                const [key, val] = line.trim().split(',');
                if (key === "jarak") $('val-jarak').innerHTML = `${val}<span class="sensor-unit">cm</span>`;
                if (key === "jarak_manual") $('val-jarak-manual').innerHTML = `${val}<span class="sensor-unit">cm</span>`;
                if (key === "Relay") {
                    const isOn = val == "1";
                    $('lbl-relay').innerText = isOn ? "ON" : "OFF";
                    if(isOn) $('card-relay').classList.add('on'); else $('card-relay').classList.remove('on');
                }
            });
        });
        state.bleConnected = true;
        $('status-bt').innerText = "Connected";
        $('btn-connect-ble').disabled = true;
        $('btn-disconnect-ble').disabled = false;
        log("Micro:bit Connected!", "#81c784");
    } catch (e) { log("BLE Error: " + e.message, "#ef5350"); }
}

async function sendBLE(key, val) {
    if (!state.rxChar) return;
    await state.rxChar.writeValue(new TextEncoder().encode(`${key},${val}\n`));
}

window.toggleRelay = (val) => sendBLE("Relay", val ? 1 : 0);

// Firebase Logic
$('btn-connect-fb').onclick = async () => {
    const config = { apiKey: $('fb-apiKey').value, databaseURL: $('fb-dbUrl').value };
    const app = initializeApp(config);
    state.db = getDatabase(app);
    state.path = $('fb-path').value;
    onValue(ref(state.db, state.path), (snap) => {
        log("Firebase Data Updated", "#4db6ac");
    });
};

$('btn-connect-ble').onclick = connectBLE;
$('btnClearLog').onclick = () => $('terminalLog').innerHTML = '';
</script>
</body>
</html>
