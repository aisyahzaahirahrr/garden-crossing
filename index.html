<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Crossing Hidroponik 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-teal: #4db6ac;
            --light-teal: #b2dfdb;
            --card-white: rgba(255, 255, 255, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            /* Gradasi sesuai UI: Biru muda -> Hijau muda -> Kuning muda */
            background: linear-gradient(180deg, #d1f2eb 0%, #e8f6f3 30%, #f9fbe7 70%, #fff9c4 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 40px 10px;
            overflow-x: hidden;
        }

        /* --- BACKGROUND SHAPES (Vector hiasan melengkung) --- */
        .bg-shape { position: absolute; z-index: -1; pointer-events: none; opacity: 0.5; }
        .shape-1 { top: 10%; left: -50px; width: 300px; } /* Vector melengkung kiri */
        .shape-2 { top: 40%; right: -50px; width: 350px; } /* Vector kanan */

        .wrapper { max-width: 850px; margin: 0 auto; position: relative; }

        /* --- HEADER --- */
        .header { text-align: center; margin-bottom: 60px; position: relative; }
        .logo-main { width: 380px; max-width: 90%; margin-bottom: 10px; }
        .tagline { 
            background: #4cb6ac; color: white; padding: 8px 35px; 
            border-radius: 50px; display: inline-block; font-weight: 800;
            box-shadow: 0 4px 0 #3b8e86; font-size: 1.1em;
        }

        /* 3 Tupai di Atas Logo */
        .top-squad { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; }
        .top-squad img { width: 60px; height: auto; }

        /* --- CARDS --- */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 25px; }

        .card {
            background: var(--card-white);
            border: 5px solid #ffffff;
            border-radius: 35px;
            padding: 25px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }

        .card-title {
            color: var(--bg-teal); font-weight: 900; font-size: 0.8em; 
            text-transform: uppercase; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
        }

        input {
            width: 100%; padding: 12px 20px; border-radius: 15px; border: 2px solid #e0f2f1;
            margin-bottom: 10px; font-family: inherit; outline: none; background: #fafdfc;
        }

        .btn {
            background: var(--bg-teal); color: white; border: none; padding: 12px;
            border-radius: 50px; font-weight: 800; cursor: pointer; width: 100%;
            box-shadow: 0 5px 0 #3b8e86; transition: 0.2s;
        }

        /* --- SENSOR & RELAY --- */
        .sensor-display { text-align: center; margin: 15px 0; }
        .sensor-val { font-size: 4em; font-weight: 900; color: #546e7a; }
        .sensor-unit { font-size: 0.4em; color: #b0bec5; margin-left: 5px; }

        .relay-status { font-size: 2.5em; font-weight: 900; color: #cfd8dc; transition: 0.3s; margin-top: 10px; }
        .card.on .relay-status { color: var(--bg-teal); }
        .relay-icon-big { font-size: 5em; color: #eceff1; transition: 0.3s; }
        .card.on .relay-icon-big { color: #ffca28; }

        /* --- CHARACTER POSITIONS (Sesuai UI kamu) --- */
        .char { position: absolute; z-index: 10; pointer-events: none; }
        .char-marshall-bt { top: -40px; right: -20px; width: 85px; } /* Marshall di Microbit */
        .char-marshall-sensor { bottom: -20px; right: -35px; width: 95px; } /* Marshall di Ultrasonic 2 */
        .char-mint-relay { bottom: -40px; left: 50%; transform: translateX(-50%); width: 100px; } /* Mint di Aktuator */
        .char-poppy-terminal { bottom: -15px; left: -40px; width: 100px; } /* Poppy di Terminal */
        .char-mint-mini { bottom: 10px; right: 10px; width: 50px; } /* Mint kecil di history */

        /* --- TERMINAL --- */
        .terminal-box {
            background: #14a098; border-radius: 35px; padding: 30px; 
            border: 6px solid #ffffff; position: relative; margin-top: 50px;
        }
        .log-screen { height: 130px; overflow-y: auto; color: #e0f2f1; font-family: 'Space Mono', monospace; font-size: 13px; }
        .team-label { 
            position: absolute; bottom: -15px; left: 60px; 
            background: #ff8a80; color: white; padding: 4px 15px; 
            border-radius: 10px; font-weight: 800; font-size: 0.8em;
        }

        /* --- DECOR ASSETS --- */
        .asset-coin { position: absolute; width: 45px; top: 150px; right: 40px; }
        .asset-leaf { position: absolute; width: 55px; top: 130px; left: 30px; }
        .asset-shovel { position: absolute; bottom: 15px; right: 15px; width: 50px; }

        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector.png?raw=true" class="bg-shape shape-1">
    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20256.png?raw=true" class="bg-shape shape-2">

    <div class="wrapper">
        
        <div class="header">
            <div class="top-squad">
                <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2018.png?raw=true"> <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2017.png?raw=true"> <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2019.png?raw=true"> </div>
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%203.png?raw=true" class="logo-main">
            <br>
            <div class="tagline">Monitoring & control automatic</div>
            
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20257.png?raw=true" class="asset-coin">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector.png?raw=true" class="asset-leaf">
        </div>

        <div class="grid-2">
            <div class="card">
                <div class="card-title"><i class="fas fa-cloud"></i> Firebase Database</div>
                <input type="password" placeholder="API Key">
                <input type="text" placeholder="Database URL">
                <input type="text" placeholder="Node Path" value="smarthome/ruangan1">
                <button class="btn">Hubungkan Firebase</button>
            </div>

            <div class="card">
                <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2018.png?raw=true" class="char char-marshall-bt">
                <div class="card-title"><i class="fas fa-microchip"></i> Micro:bit BLE</div>
                <div style="height: 100px; border: 3px dashed #b2dfdb; border-radius: 20px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; color: #b2dfdb;">
                    <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%203.png?raw=true" style="width: 80px; opacity: 0.3;">
                </div>
                <button class="btn">Connect Microbit</button>
            </div>
        </div>

        <div class="card" style="margin-bottom: 40px; padding: 15px 30px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="card-title" style="margin: 0;"><i class="fas fa-cog"></i> Mode Sistem</div>
                <div style="background: #f1f8e9; padding: 5px; border-radius: 50px; display: flex; gap: 5px;">
                    <button class="btn" style="padding: 5px 20px; font-size: 0.8em; background: #fff; color: #4db6ac; box-shadow: none;">Manual</button>
                    <button class="btn" style="padding: 5px 20px; font-size: 0.8em;">Otomatis</button>
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <div class="card-title"><i class="fas fa-tint"></i> Ultrasonic 1 (P0/P1)</div>
                <div class="sensor-display">
                    <div class="sensor-val" id="val-jarak">--<span class="sensor-unit">CM</span></div>
                </div>
                <p style="font-size: 0.7em; color: #999; text-align: center;">Pompa relay ON jika jarak >= 30 cm</p>
            </div>

            <div class="card">
                <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2018.png?raw=true" class="char char-marshall-sensor">
                <div class="card-title"><i class="fas fa-water"></i> Ultrasonic 2 (Ember)</div>
                <div class="sensor-display">
                    <div class="sensor-val" id="val-jarak-manual" style="color: #4db6ac;">--<span class="sensor-unit">CM</span></div>
                </div>
            </div>
        </div>

        <div class="card" style="max-width: 450px; margin: 40px auto; text-align: center;">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2019.png?raw=true" class="char char-mint-relay">
            <div class="card-title" style="justify-content: center;"><i class="fas fa-bolt"></i> Aktuator</div>
            <div class="relay-icon-big"><i class="fas fa-bolt"></i></div>
            <div style="font-weight: 800; color: #90a4ae; font-size: 0.9em;">RELAY</div>
            <div class="relay-status">OFF</div>
        </div>

        <div class="grid-2" style="margin-top: 60px;">
            <div class="card">
                <div class="card-title"><i class="fas fa-chart-line"></i> Jarak (CM)</div>
                <div style="height: 80px;"><canvas id="chart-jarak"></canvas></div>
            </div>
            <div class="card">
                <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2019.png?raw=true" class="char char-mint-mini">
                <div class="card-title"><i class="fas fa-chart-area"></i> Jarak Manual (CM)</div>
                <div style="height: 80px;"><canvas id="chart-jarak-manual"></canvas></div>
            </div>
        </div>

        <div class="terminal-box">
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%2017.png?raw=true" class="char char-poppy-terminal">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                <div style="width: 12px; height: 12px; border-radius: 50%; background: #ff5252;"></div>
                <div style="width: 12px; height: 12px; border-radius: 50%; background: #ffca28;"></div>
                <div style="width: 12px; height: 12px; border-radius: 50%; background: #4caf50;"></div>
                <span style="color: white; font-weight: 800; font-size: 0.9em; margin-left: 10px;">system_terminal</span>
            </div>
            <div id="terminalLog" class="log-screen"></div>
            
            <div class="team-label">TigaTupai</div>
            <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Vector%20265.png?raw=true" class="asset-shovel">
        </div>
        
        <img src="https://github.com/aisyahzaahirahrr/garden-crossing/blob/main/Group%208.png?raw=true" style="width: 45px; display: block; margin: 20px auto;">
    </div>

<script>
    // Logic Chart (Logic BLE/Firebase kamu tinggal masukin lagi ke sini)
    const initCharts = () => {
        const cfg = (color) => ({
            type: 'line',
            data: { labels: [], datasets: [{ data: [], borderColor: color, fill: false, tension: 0.4, pointRadius: 0 }] },
            options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
        });
        new Chart(document.getElementById('chart-jarak'), cfg('#5c6bc0'));
        new Chart(document.getElementById('chart-jarak-manual'), cfg('#4db6ac'));
    }
    window.onload = initCharts;
</script>
</body>
</html>
